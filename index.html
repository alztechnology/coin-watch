<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>AL Wolf Coin Watch</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🐺</text></svg>">
<style>
:root{--bg:#0b0e14;--card:#141a24;--line:#232c3b;--tx:#e6ebf2;--mut:#8b97a8;--acc:#6ea8ff;--up:#2ecc8f;--dn:#ff5d73;--warn:#f5b942}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(900px 400px at 85% -10%,#1b2540 0,transparent 60%),var(--bg);color:var(--tx);font:14px/1.45 system-ui,Segoe UI,Roboto,sans-serif}
header{padding:16px 14px 6px;max-width:1100px;margin:auto}
h1{margin:0;font-size:22px}h1 span{color:var(--acc)}
.sub{color:var(--mut);font-size:12px;margin-top:4px}
main{max-width:1100px;margin:auto;padding:8px 14px 40px}
h2{font-size:15px;margin:22px 0 8px;color:var(--acc)}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}
.c{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.c b{font-size:16px}.c .r{color:var(--warn);font-weight:600}
.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:8px 0}
input,select,button{background:#101620;color:var(--tx);border:1px solid var(--line);border-radius:8px;padding:8px 10px;font:inherit}
button{cursor:pointer}button:hover{border-color:var(--acc)}
label{color:var(--mut);display:flex;gap:6px;align-items:center}
.wrap{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--card)}
table{border-collapse:collapse;width:100%;min-width:640px}
th,td{padding:8px 10px;text-align:right;white-space:nowrap;border-bottom:1px solid var(--line)}
th:first-child,td:first-child{text-align:left}
th{color:var(--mut);cursor:pointer;user-select:none;position:sticky;top:0;background:#101620;font-weight:600;font-size:12px}
th.s::after{content:" ▾"}th.s.asc::after{content:" ▴"}
tr:hover td{background:#18202d}
.up{color:var(--up)}.dn{color:var(--dn)}
.tag{display:inline-block;padding:1px 7px;border-radius:99px;font-size:11px;margin-left:4px;border:1px solid}
.vb{color:var(--up);border-color:var(--up)}.pp{color:var(--warn);border-color:var(--warn)}.tv{color:var(--mut);border-color:var(--mut)}
.add{padding:2px 8px;font-size:12px}
.mine{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:8px;margin:8px 0}
.mine input{width:100%}
footer{color:var(--mut);font-size:12px;text-align:center;padding:20px 14px;border-top:1px solid var(--line)}
.empty{color:var(--mut);padding:14px}
</style><style>.boom{color:var(--warn);font-weight:700}.why{color:var(--mut);font-size:11px}td input{width:90px;padding:4px 6px}</style></head><body>
<header><h1>AL Wolf <span>Coin Watch</span> 🚀</h1><div class="sub" id="sub">Loading…</div></header>
<main>
<h2>💥 Boom radar <span class="sub">(small caps &lt;$500M with volume building + momentum)</span></h2>
<div class="cards" id="radar"></div>
<h2>📊 Watchlist</h2>
<div class="bar"><input id="q" placeholder="Filter coin…"><button id="rf">↻ Refresh</button></div>
<div class="wrap"><table><thead><tr id="hd"></tr></thead><tbody id="tb"></tbody></table></div>
<footer><p>Entry prices are saved only in this browser (localStorage). Data from CoinMarketCap, refreshed every ~15 min. Not financial advice.</p></footer>
</main>
<script>
const C=[["sym","Coin"],["price","Price"],["p1h","1h %"],["p24h","24h %"],["p7d","7d %"],["mcap","Mkt cap"],["vol","Vol 24h"],["volchg","Vol chg %"],["vr","Vol/MCap"],["boom","Boom"],["entry","Entry $"],["fe","% from entry"]];
let D=[],sk="boom",asc=false;const E=JSON.parse(localStorage.getItem("cw_entry")||"{}");
const fp=v=>v==null?"–":v>=1?v.toLocaleString(undefined,{maximumFractionDigits:4}):v.toPrecision(4);
const fb=v=>v==null?"–":v>=1e9?"$"+(v/1e9).toFixed(2)+"B":v>=1e6?"$"+(v/1e6).toFixed(1)+"M":"$"+(v/1e3).toFixed(0)+"K";
const pc=v=>v==null?"–":`<span class="${v>=0?"up":"dn"}">${v>=0?"+":""}${v.toFixed(2)}%</span>`;
function fe(r){const e=parseFloat(E[r.sym]);return e>0?(r.price/e-1)*100:null}
function draw(){
 document.getElementById("hd").innerHTML=C.map(([k,l])=>`<th data-k="${k}" class="${k==sk?"s"+(asc?" asc":""):""}">${l}</th>`).join("");
 const q=document.getElementById("q").value.toUpperCase();
 const rows=D.filter(r=>!q||r.sym.includes(q)||r.name.toUpperCase().includes(q)).map(r=>({...r,entry:parseFloat(E[r.sym])||null,fe:fe(r)}));
 rows.sort((a,b)=>{let x=a[sk],y=b[sk];if(sk=="sym")return asc?x.localeCompare(y):y.localeCompare(x);x=x??-1e99;y=y??-1e99;return asc?x-y:y-x});
 document.getElementById("tb").innerHTML=rows.map(r=>`<tr><td><a style="color:var(--tx)" target="_blank" href="https://coinmarketcap.com/currencies/${r.slug}/"><b>${r.sym}</b></a> <span class="why">${r.name}</span></td><td>$${fp(r.price)}</td><td>${pc(r.p1h)}</td><td>${pc(r.p24h)}</td><td>${pc(r.p7d)}</td><td>${fb(r.mcap)}</td><td>${fb(r.vol)}</td><td>${pc(r.volchg)}</td><td>${r.vr==null?"–":(r.vr*100).toFixed(1)+"%"}</td><td class="boom">${r.boom?"🔥".repeat(Math.min(3,Math.ceil(r.boom/2)))+" "+r.boom:"–"}</td><td><input data-s="${r.sym}" value="${E[r.sym]||""}" inputmode="decimal" placeholder="—"></td><td>${pc(r.fe)}</td></tr>`).join("");
 const rad=D.filter(r=>r.boom>=2).sort((a,b)=>b.boom-a.boom);
 document.getElementById("radar").innerHTML=rad.length?rad.map(r=>`<div class="c"><b>${r.sym}</b> <span class="r">🔥 ${r.boom}</span><div>$${fp(r.price)} · ${pc(r.p24h)}</div><div class="why">${r.why.join(" · ")}</div></div>`).join(""):'<div class="c">Quiet right now — no small cap flagged.</div>';
}
document.addEventListener("click",e=>{const k=e.target.dataset&&e.target.dataset.k;if(k){asc=sk==k?!asc:k=="sym";sk=k;draw()}});
document.addEventListener("change",e=>{const s=e.target.dataset&&e.target.dataset.s;if(s){const v=e.target.value.trim();v?E[s]=v:delete E[s];localStorage.setItem("cw_entry",JSON.stringify(E));draw()}});
document.getElementById("q").oninput=draw;
async function load(){const j=await (await fetch("data.json?"+Date.now())).json();D=j.coins;
 document.getElementById("sub").textContent=`Updated ${new Date(j.updated*1000).toLocaleString("en-MY",{timeZone:"Asia/Kuala_Lumpur",dateStyle:"medium",timeStyle:"short"})} MYT · ${D.length} coins · source: ${j.source}`;draw()}
document.getElementById("rf").onclick=load;load();setInterval(load,300000);
</script></body></html>
